<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scanner Velada</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
      margin: 0;
    }

    h1 {
      margin-bottom: 5px;
      color: #222;
    }

    .subtitulo {
      color: #666;
      margin-top: 5px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    #resultado {
      margin: 20px auto;
      padding: 20px;
      max-width: 500px;
      background: white;
      border-radius: 12px;
      font-size: 22px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .codigo {
      font-size: 36px;
      font-weight: bold;
      margin-top: 10px;
    }

    .ok {
      color: #16803c;
      font-size: 30px;
      font-weight: bold;
    }

    .error {
      color: #c62828;
      font-size: 28px;
      font-weight: bold;
    }

    .aviso {
      color: #d17b00;
      font-size: 28px;
      font-weight: bold;
    }

    button {
      display: none;
      padding: 15px 25px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 10px;
      border: none;
      background: #222;
      color: white;
      margin: 20px auto;
      cursor: pointer;
    }

    button:active {
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <h1>Scanner Velada</h1>

  <p class="subtitulo">
    Apunta la cámara al código de la entrada
  </p>

  <div id="reader"></div>

  <div id="resultado">
    Esperando código...
  </div>

  <button id="nuevo">
    🔄 Escanear otra entrada
  </button>


  <script>

    /*
    ========================================
    APPS SCRIPT
    ========================================
    */

    const APP_SCRIPT_URL =
      'https://script.google.com/macros/s/AKfycbx3GhYrBAgnWreY-qEwEfE8N2DmvZfbOC2iB_uFUc3iewD3sfoBojRzFtT_r-CsD1IHzg/exec';


    let scanner = null;
    let escaneando = false;


    /*
    ========================================
    NORMALIZAR CÓDIGO
    ========================================
    */

    function normalizarCodigo(codigo) {

      codigo = String(codigo || '')
        .trim()
        .toUpperCase();

      if (codigo.startsWith('ETIVM26')) {

        return String(
          parseInt(codigo.substring(7), 10)
        );

      }

      const match = codigo.match(/(\d+)$/);

      if (match) {

        return String(
          parseInt(match[1], 10)
        );

      }

      return codigo;
    }


    /*
    ========================================
    MOSTRAR RESULTADO
    ========================================
    */

    function mostrarResultado(resultado) {

      const div =
        document.getElementById('resultado');

      if (resultado.estado === 'ok') {

        div.innerHTML =
          '<div class="ok">✓ ACCESO AUTORIZADO</div>' +
          '<br>' +
          '<div><strong>' +
          resultado.nombre +
          '</strong></div>' +
          '<div>' +
          (resultado.tipo || '') +
          '</div>' +
          '<br>' +
          '<div>Forma de pago:</div>' +
          '<div><strong>' +
          resultado.formaPago +
          '</strong></div>' +
          '<div style="font-size:16px;margin-top:10px;">' +
          resultado.hora +
          '</div>';

        return;
      }


      if (resultado.estado === 'duplicado') {

        div.innerHTML =
          '<div class="aviso">⚠ YA INGRESÓ</div>' +
          '<br>' +
          '<div><strong>' +
          resultado.nombre +
          '</strong></div>' +
          '<br>' +
          '<div>Ingreso registrado:</div>' +
          '<div>' +
          resultado.hora +
          '</div>';

        return;
      }


      if (resultado.estado === 'no_pagada') {

        div.innerHTML =
          '<div class="error">✕ ACCESO RECHAZADO</div>' +
          '<br>' +
          '<div><strong>' +
          resultado.nombre +
          '</strong></div>' +
          '<br>' +
          '<div>Entrada no pagada</div>';

        return;
      }


      if (resultado.estado === 'no_encontrado') {

        div.innerHTML =
          '<div class="error">✕ NO ENCONTRADO</div>' +
          '<br>' +
          '<div>Código:</div>' +
          '<div class="codigo">' +
          resultado.codigo +
          '</div>';

        return;
      }


      div.innerHTML =
        '<div class="error">ERROR</div>' +
        '<br>' +
        (resultado.mensaje || 'Error desconocido');
    }


    /*
    ========================================
    CONSULTAR APPS SCRIPT
    ========================================
    */

    function consultarAcceso(codigo) {

      document.getElementById('resultado').innerHTML =
        '<strong>Consultando...</strong>';

      const callbackName =
        'respuestaScanner_' + Date.now();

      const script =
        document.createElement('script');

      window[callbackName] = function(resultado) {

        mostrarResultado(resultado);

        delete window[callbackName];

        script.remove();

        document.getElementById('nuevo').style.display =
          'block';
      };


      script.src =
        APP_SCRIPT_URL +
        '?api=acceso' +
        '&codigo=' +
        encodeURIComponent(codigo) +
        '&callback=' +
        encodeURIComponent(callbackName);


      script.onerror = function() {

        document.getElementById('resultado').innerHTML =
          '<div class="error">ERROR DE CONEXIÓN</div>';

        delete window[callbackName];

        script.remove();

        document.getElementById('nuevo').style.display =
          'block';
      };


      document.body.appendChild(script);
    }


    /*
    ========================================
    CÓDIGO DETECTADO
    ========================================
    */

    function codigoDetectado(codigoOriginal) {

      if (!escaneando) {
        return;
      }

      escaneando = false;

      const codigo =
        normalizarCodigo(codigoOriginal);

      document.getElementById('resultado').innerHTML =
        '<div>Código leído:</div>' +
        '<div class="codigo">' +
        codigo +
        '</div>' +
        '<div style="margin-top:10px;font-size:16px;">' +
        'Consultando validador...' +
        '</div>';

scanner.stop()
  .then(() => {

    consultarAcceso(codigo);

  })
  .catch(() => {

    consultarAcceso(codigo);

  });
    }


    /*
    ========================================
    INICIAR SCANNER
    ========================================
    */

    function iniciarScanner() {

      document.getElementById('nuevo').style.display =
        'none';

      document.getElementById('resultado').innerHTML =
        'Esperando código...';

      scanner =
        new Html5Qrcode("reader");

      escaneando = true;

      scanner.start(

        { facingMode: "environment" },

        {
          fps: 10,

          qrbox: {
            width: 280,
            height: 120
          }
        },

        (decodedText) => {

          codigoDetectado(decodedText);

        },

        (errorMessage) => {

          // Ignoramos errores normales
          // mientras busca el código.

        }

      ).catch((error) => {

        escaneando = false;

        document.getElementById('resultado').innerHTML =
          '<div class="error">' +
          'NO SE PUDO INICIAR LA CÁMARA' +
          '</div><br>' +
          error;

      });
    }


    /*
    ========================================
    BOTÓN NUEVA ENTRADA
    ========================================
    */

document.getElementById('nuevo').onclick =
  async function() {

    const boton =
      document.getElementById('nuevo');

    boton.style.display = 'none';

    document.getElementById('resultado').innerHTML =
      'Iniciando cámara...';

    try {

      if (scanner) {

        await scanner.clear();

        scanner = null;
      }

    } catch (error) {

      console.log('Error limpiando scanner:', error);

      scanner = null;
    }

    // Pequeña pausa para asegurar que
    // la cámara anterior se haya liberado.

    setTimeout(function() {

      iniciarScanner();

    }, 300);

  };


    /*
    ========================================
    ARRANQUE
    ========================================
    */

    iniciarScanner();

  </script>

</body>
</html>
