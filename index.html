<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scanner Velada</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 10px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
    }

    #resultado {
      margin-top: 20px;
      padding: 20px;
      background: white;
      border-radius: 10px;
      font-size: 22px;
    }

    .codigo {
      font-size: 36px;
      font-weight: bold;
      margin-top: 10px;
    }

    button {
      padding: 12px 20px;
      font-size: 18px;
      border-radius: 8px;
      border: none;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <h1>Scanner Velada</h1>

  <p>Apunta la cámara al código de la entrada</p>

  <div id="reader"></div>

  <div id="resultado">
    Esperando código...
  </div>

  <script>

function normalizarCodigo(codigo) {

  codigo = String(codigo || '')
    .trim()
    .toUpperCase();

  // Formato real del código de barras:
  // ETIVM260100
  // ETIVM260101
  // ETIVM260102
  //
  // Se elimina ETIVM26 y queda:
  // 100
  // 101
  // 102

  if (codigo.startsWith('ETIVM26')) {
    return String(parseInt(codigo.substring(7), 10));
  }

  // También permite ingresar directamente:
  // 100
  // 0100

  const match = codigo.match(/(\d+)$/);

  if (match) {
    return String(parseInt(match[1], 10));
  }

  return codigo;
}



    function codigoDetectado(codigoOriginal) {

      const codigo = normalizarCodigo(codigoOriginal);

      document.getElementById('resultado').innerHTML =
        '<div>Código leído:</div>' +
        '<div class="codigo">' + codigo + '</div>' +
        '<div style="margin-top:10px;font-size:16px;">' +
        'Original: ' + codigoOriginal +
        '</div>';

    }


    function iniciarScanner() {

      const scanner = new Html5Qrcode("reader");

      scanner.start(
        { facingMode: "environment" },

        {
          fps: 10,
          qrbox: {
            width: 280,
            height: 120
          }
        },

        (decodedText) => {

          codigoDetectado(decodedText);

          scanner.stop().catch(() => {});

        },

        (errorMessage) => {

          // Ignoramos errores normales mientras busca el código

        }

      ).catch((error) => {

        document.getElementById('resultado').innerHTML =
          '<strong>No se pudo iniciar la cámara.</strong><br><br>' +
          error;

      });

    }


    iniciarScanner();

  </script>

</body>
</html>
