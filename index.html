<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scanner Velada</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 10px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
    }

    #resultado {
      margin-top: 20px;
      padding: 20px;
      background: white;
      border-radius: 10px;
      font-size: 22px;
    }

    .codigo {
      font-size: 36px;
      font-weight: bold;
      margin-top: 10px;
    }

    .ok {
      font-size: 30px;
      font-weight: bold;
    }

    button {
      padding: 12px 20px;
      font-size: 18px;
      border-radius: 8px;
      border: none;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <h1>Scanner Velada</h1>

  <p>Apunta la cámara al código de la entrada</p>

  <div id="reader"></div>

  <div id="resultado">
    Esperando código...
  </div>

  <script>

    /*
    ========================================
    DIRECCIÓN DEL APPS SCRIPT
    ========================================
    */

    const APP_SCRIPT_URL =
      'https://script.google.com/macros/s/AKfycbx3GhYrBAgnWreY-qEwEfE8N2DmvZfbOC2iB_uFUc3iewD3sfoBojRzFtT_r-CsD1IHzg/exec';


    /*
    ========================================
    NORMALIZAR CÓDIGO
    ========================================
    */

    function normalizarCodigo(codigo) {

      codigo = String(codigo || '')
        .trim()
        .toUpperCase();

      // Código real:
      // ETIVM260100
      // ETIVM260101
      // ETIVM260102

      if (codigo.startsWith('ETIVM26')) {

        return String(
          parseInt(codigo.substring(7), 10)
        );

      }

      // También permite:
      // 100
      // 0100

      const match = codigo.match(/(\d+)$/);

      if (match) {

        return String(
          parseInt(match[1], 10)
        );

      }

      return codigo;
    }


    /*
    ========================================
    MOSTRAR RESULTADO
    ========================================
    */

    function mostrarResultado(resultado) {

      const div =
        document.getElementById('resultado');

      if (resultado.estado === 'ok') {

        div.innerHTML =
          '<div class="ok">✓ ACCESO AUTORIZADO</div>' +
          '<br>' +
          '<div><strong>' +
          resultado.nombre +
          '</strong></div>' +
          '<div>' +
          (resultado.tipo || '') +
          '</div>' +
          '<br>' +
          '<div>Forma de pago: <strong>' +
          resultado.formaPago +
          '</strong></div>' +
          '<div style="font-size:16px;margin-top:10px;">' +
          resultado.hora +
          '</div>';

        return;
      }


      if (resultado.estado === 'duplicado') {

        div.innerHTML =
          '<div style="font-size:28px;font-weight:bold;">⚠ YA INGRESÓ</div>' +
          '<br>' +
          '<div><strong>' +
          resultado.nombre +
          '</strong></div>' +
          '<br>' +
          '<div>Ingreso registrado:</div>' +
          '<div>' +
          resultado.hora +
          '</div>';

        return;
      }


      if (resultado.estado === 'no_pagada') {

        div.innerHTML =
          '<div style="font-size:28px;font-weight:bold;">✕ ACCESO RECHAZADO</div>' +
          '<br>' +
          '<div><strong>' +
          resultado.nombre +
          '</strong></div>' +
          '<br>' +
          '<div>Entrada no pagada</div>';

        return;
      }


      if (resultado.estado === 'no_encontrado') {

        div.innerHTML =
          '<div style="font-size:28px;font-weight:bold;">✕ NO ENCONTRADO</div>' +
          '<br>' +
          '<div>Código:</div>' +
          '<div class="codigo">' +
          resultado.codigo +
          '</div>';

        return;
      }


      div.innerHTML =
        '<strong>Error</strong><br><br>' +
        (resultado.mensaje || 'Error desconocido');
    }


    /*
    ========================================
    CONSULTAR APPS SCRIPT
    ========================================

    Usamos JSONP para evitar problemas de
    seguridad del navegador (CORS).
    */

    function consultarAcceso(codigo) {

      document.getElementById('resultado').innerHTML =
        '<strong>Consultando...</strong>';

      const callbackName =
        'respuestaScanner_' + Date.now();

      const script =
        document.createElement('script');

      window[callbackName] = function(resultado) {

        mostrarResultado(resultado);

        delete window[callbackName];

        script.remove();
      };


      script.src =
        APP_SCRIPT_URL +
        '?api=acceso' +
        '&codigo=' +
        encodeURIComponent(codigo) +
        '&callback=' +
        encodeURIComponent(callbackName);


      script.onerror = function() {

        document.getElementById('resultado').innerHTML =
          '<strong>Error de conexión con el validador.</strong>';

        delete window[callbackName];

        script.remove();
      };


      document.body.appendChild(script);
    }


    /*
    ========================================
    CÓDIGO DETECTADO
    ========================================
    */

    function codigoDetectado(codigoOriginal) {

      const codigo =
        normalizarCodigo(codigoOriginal);

      document.getElementById('resultado').innerHTML =
        '<div>Código leído:</div>' +
        '<div class="codigo">' +
        codigo +
        '</div>' +
        '<div style="margin-top:10px;font-size:16px;">' +
        'Consultando validador...' +
        '</div>';

      consultarAcceso(codigo);
    }


    /*
    ========================================
    INICIAR SCANNER
    ========================================
    */

    function iniciarScanner() {

      const scanner =
        new Html5Qrcode("reader");

      scanner.start(

        { facingMode: "environment" },

        {
          fps: 10,

          qrbox: {
            width: 280,
            height: 120
          }
        },

        (decodedText) => {

          codigoDetectado(decodedText);

          scanner.stop().catch(() => {});

        },

        (errorMessage) => {

          // Errores normales mientras busca
          // un código: no hacemos nada.

        }

      ).catch((error) => {

        document.getElementById('resultado').innerHTML =
          '<strong>No se pudo iniciar la cámara.</strong><br><br>' +
          error;

      });
    }


    iniciarScanner();

  </script>

</body>
</html>
